{{ define "head" }}
{{ partial "seo/seo-ld-json.html" . }}
{{ end }}
{{ define "main" }}
<section id="main">
  <div id="content">
    {{ .Content }}
  </div>
</section>
<aside id="meta">
  <div>
    <section>
      <p id="date"> Originally Published:
        {{ $published := (dict "time" .Date "format" "Mon Jan 2, 2006 at 03:04PM") }}
        {{ partialCached "time.html" $published $published }}
      </p>
    </section>
  </div>
</aside>
{{ end }}
